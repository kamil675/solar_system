<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Controlled Video + Three.js Solar System (Merged)</title>
    <style>
      @font-face {
        font-family: "NeueHaasDisplay";
        src: url("neue-haas-grotesk-display-pro-cufonfonts/NeueHaasDisplayBlackItalic.ttf")
          format("truetype");
        font-weight: bold;
        font-style: normal;
      }
      :root {
        --bg: #000;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        height: 100%;
        overflow: auto;
        font-family: "NeueHaasDisplay", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #scrollContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 800vh;
        pointer-events: none;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 10000;
        background: black;
        transition: opacity 0.5s ease;
      }
      #loaderCanvas {
        width: 300px !important;
        height: 300px !important;
      }
      #loading-bar-container {
        width: 200px;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        margin-top: 20px;
        overflow: hidden;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ffaa00, #ffd700);
        border-radius: 4px;
        transition: width 0.3s ease;
      }
      #loading-text {
        color: white;
        font-family: "NeueHaasDisplay", sans-serif;
        font-size: clamp(16px, 1.5vw, 22px);
        margin-top: 20px;
      }
      #topText {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: "NeueHaasDisplay", sans-serif;
        font-size: clamp(12px, 6vw, 120px);
        font-weight: bold;
        z-index: 9500;
        /* pointer-events: none; */
        white-space: nowrap;
        transition: transform 0.1s ease-out;
        cursor: default;
        opacity: 0;
      }
        #topText.hovered {
          transition: none;
        }
        #solarText {
          position: fixed;
          top: 40%;
          left: 50%;
          transform: translateX(-50%);
          color: white;
          font-family: "NeueHaasDisplay", sans-serif;
          font-size: clamp(12px, 4vw, 80px);
          font-weight: bold;
          z-index: 9000;
          pointer-events: none;
          white-space: nowrap;
          opacity: 0;
          visibility: hidden;
        }

        #videoSection {
          position: fixed;
          inset: 0;
          z-index: 8000;
          display: flex;
          align-items: center;
          justify-content: center;
          background: black;
          pointer-events: none;
          visibility: visible;
        }

        #astronautVideo {
          width: 100vw;
          height: 100vh;
          object-fit: cover;
          display: block;
          opacity: 0;
          visibility: visible;
          transition: opacity 0.6s linear;
        }
        canvas,
        .three-canvas {
          position: fixed !important;
          top: 0;
          left: 0;
          z-index: 9000; /* pehle 7000 tha */
          pointer-events: auto;
          width: 100% !important;
          height: 100% !important;
          opacity: 0;
          transition: opacity 0.3s linear;
        }

        .planet-label {
          color: white;
          font-family: "NeueHaasDisplay", sans-serif;
          font-size: clamp(10px, 1.2vw, 16px);
          font-weight: bold;
          pointer-events: none;
          text-shadow: 0 0 5px black;
        }
        html {
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        html::-webkit-scrollbar {
          display: none;
        }

        #solarText {
          font-size: clamp(10px, 3.5vw, 60px);
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <canvas id="loaderCanvas" width="200" height="200"></canvas>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
    </div>
    <div id="topText"></div>
    <div id="solarText"></div>
    <div id="videoSection">
      <video
        id="astronautVideo"
        src="textures/models/video.mp4"
        type="video/mp4"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        crossorigin="anonymous"
      ></video>
    </div>
    <div id="scrollContainer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script>
      const loaderDiv = document.getElementById("loader");
      const loaderCanvas = document.getElementById("loaderCanvas");
      const loaderCtx = loaderCanvas.getContext("2d");
      const loadingBar = document.getElementById("loading-bar");

      const loaderSunRadius = 30;
      const loaderPlanets = [
        { radius: 50, size: 5, speed: 0.05, color: "#ff6666" },
        { radius: 80, size: 7, speed: 0.04, color: "#ffcc66" },
        { radius: 110, size: 6, speed: 0.03, color: "#66ccff" },
        { radius: 140, size: 4, speed: 0.02, color: "#ff3333" },
      ];

      function drawLoader() {
        loaderCtx.clearRect(0, 0, loaderCanvas.width, loaderCanvas.height);
        loaderCtx.save();
        loaderCtx.translate(loaderCanvas.width / 2, loaderCanvas.height / 2);

        const sunGrad = loaderCtx.createRadialGradient(
          0,
          0,
          0,
          0,
          0,
          loaderSunRadius
        );
        sunGrad.addColorStop(0, "#ffff33");
        sunGrad.addColorStop(0.7, "#ffaa00");
        sunGrad.addColorStop(1, "rgba(255, 165, 0, 0)");
        loaderCtx.beginPath();
        loaderCtx.arc(0, 0, loaderSunRadius, 0, Math.PI * 2);
        loaderCtx.fillStyle = sunGrad;
        loaderCtx.fill();

        loaderPlanets.forEach((p) => {
          loaderCtx.beginPath();
          loaderCtx.arc(0, 0, p.radius, 0, Math.PI * 2);
          loaderCtx.lineWidth = 1;
          loaderCtx.strokeStyle = "rgba(255, 255, 255, 0.2)";
          loaderCtx.stroke();
        });

        loaderPlanets.forEach((p) => {
          p.angle = (p.angle || Math.random() * Math.PI * 2) + p.speed;
          const x = Math.cos(p.angle) * p.radius;
          const y = Math.sin(p.angle) * p.radius;
          loaderCtx.beginPath();
          loaderCtx.arc(x, y, p.size, 0, Math.PI * 2);
          loaderCtx.fillStyle = p.color;
          loaderCtx.fill();
        });

        loaderCtx.restore();
        requestAnimationFrame(drawLoader);
      }
      drawLoader();

      let loadedAssets = 0;
      const totalAssets = 1 + 9;
      function updateProgress() {
        const loadingProgress = Math.floor((loadedAssets / totalAssets) * 100);
        loadingBar.style.width = `${loadingProgress}%`;
        if (loadedAssets === totalAssets) {
          gsap.to(loaderDiv, {
            opacity: 0,
            duration: 0.5,
            onComplete: () => {
              loaderDiv.style.display = "none";
              window.scrollTo(0, 0);

              astronautVideo.currentTime = 0;
              astronautVideo.style.visibility = "visible";
              astronautVideo.style.opacity = 1;
              videoSection.style.visibility = "visible";
              videoSection.style.display = "flex";

              renderer.domElement.style.visibility = "visible";
              renderer.domElement.style.opacity = 1;
              labelRenderer.domElement.style.visibility = "visible";
              labelRenderer.domElement.style.opacity = 1;

              // // SHOW STARS IMMEDIATELY (fade-in)
              // gsap.to(starsRenderer.domElement, {
              //   opacity: 1,
              //   duration: 1.5,
              //   ease: "power2.out",
              // });

              document.body.style.overflowY = "auto";

              showTextAnimation();
              initSolarText();
              initScrollControl();
            },
          });
        }
      }
      astronautVideo.addEventListener("canplaythrough", () => {
        loadedAssets++;
        updateProgress();
      });

      function showTextAnimation() {
        const text = "Hey, we are Fynix";
        topText.innerHTML = "";
        const parts = text.split(", we are");
        const before = parts[0];
        const after = ", we are "; // ← space जोड़ा "are" के बाद
        const last = parts[1];

        // "Hey" part
        before.split("").forEach((char) => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          span.style.opacity = 0;
          span.style.transform = "translateY(30px)";
          span.style.display = "inline-block";
          topText.appendChild(span);
        });

        // ", we are" part (in a wrapper for fade)
        const weAreSpan = document.createElement("span");
        weAreSpan.id = "weAreSpan";
        weAreSpan.style.display = "inline-block";
        weAreSpan.style.whiteSpace = "nowrap";
        weAreSpan.style.transition = "opacity 0.3s linear, width 0.3s linear";
        topText.appendChild(weAreSpan);

        after.split("").forEach((char) => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char; // ← Fix: space → non-breaking space
          span.style.opacity = 0;
          span.style.transform = "translateY(30px)";
          span.style.display = "inline-block";
          weAreSpan.appendChild(span);
        });

        // "Fynix" part
        last.split("").forEach((char) => {
          const span = document.createElement("span");
          span.textContent = char;
          span.style.opacity = 0;
          span.style.transform = "translateY(30px)";
          span.style.display = "inline-block";
          topText.appendChild(span);
        });

        const allSpans = topText.querySelectorAll("span, #weAreSpan span");
        gsap.to(topText, { opacity: 1, duration: 0.5, ease: "power2.out" });
        gsap.to(allSpans, {
          opacity: 1,
          y: 0,
          stagger: 0.08,
          ease: "power2.out",
          duration: 0.6,
          delay: 0.3,
        });

        // === NEW: Parallax on Hover ===
        let isHovering = false;

        topText.addEventListener("mouseenter", () => {
          isHovering = true;
          topText.classList.add("hovered");
        });

        topText.addEventListener("mouseleave", () => {
          isHovering = false;
          topText.classList.remove("hovered");

          // current scroll progress से scale calculate करो
          const videoProgress = Math.min(Math.max(currentProgress / 0.5, 0), 1);
          const heyFynixProgress = Math.max((videoProgress - 0.25) / 0.75, 0);
          const scale = 1 - heyFynixProgress * 0.5;
          topText.style.transform = `translateX(-50%) scale(${scale})`;
        });

        topText.addEventListener("mousemove", (e) => {
          if (!isHovering) return;

          const rect = topText.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const deltaX = e.clientX - centerX;
          const deltaY = e.clientY - centerY;

          const moveX = deltaX * 0.03; // sensitivity
          const moveY = deltaY * 0.03;
          const rotateY = deltaX * 0.05;
          const rotateX = -deltaY * 0.05;

          topText.style.transform = `translateX(-50%) translate(${moveX}px, ${moveY}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1)`;
        });
      }

      function initSolarText() {
        const lines = [
          "A Creative space",
          "Designed by Designers for Designers",
        ];

        solarText.innerHTML = ""; // clear previous

        lines.forEach((line, lineIndex) => {
          const lineDiv = document.createElement("div");
          lineDiv.style.display = "block";
          lineDiv.style.textAlign = "center";
          lineDiv.style.marginBottom = lineIndex === 0 ? "0.1em" : "0";

          // 👇 Enhanced first line look
          if (lineIndex === 0) {
            lineDiv.style.fontSize = "2em";
            lineDiv.style.fontWeight = "900";
            lineDiv.style.letterSpacing = "0.04em";
          } else {
            lineDiv.style.fontSize = "1.2em";
            lineDiv.style.fontWeight = "400";
            lineDiv.style.letterSpacing = "0.02em";
          }

          line.split("").forEach((char) => {
            const span = document.createElement("span");
            span.textContent = char === " " ? "\u00A0" : char;
            span.style.opacity = 1;
            span.style.transform = "translateY(0)";
            span.style.display = "inline-block";
            span.style.transition = "opacity 0.3s ease, transform 0.3s ease";
            lineDiv.appendChild(span);
          });

          solarText.appendChild(lineDiv);
        });

        solarText.style.visibility = "visible";
      }

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      camera.position.set(0, 50, 350);
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.domElement.classList.add("three-canvas");
      renderer.domElement.style.opacity = 0;
      renderer.domElement.style.visibility = "hidden";
      document.body.appendChild(renderer.domElement);

      const labelRenderer = new THREE.CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = "absolute";
      labelRenderer.domElement.style.top = "0px";
      labelRenderer.domElement.style.pointerEvents = "none";
      labelRenderer.domElement.style.zIndex = "9999";
      labelRenderer.domElement.style.opacity = 0;
      labelRenderer.domElement.style.visibility = "visible";
      document.body.appendChild(labelRenderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = false;
      controls.enablePan = false;

      scene.add(new THREE.AmbientLight(0xffffff, 0.15));
      const fillLight1 = new THREE.PointLight(0xffffff, 0.3, 2000);
      fillLight1.position.set(500, 200, 500);
      scene.add(fillLight1);
      const fillLight2 = new THREE.PointLight(0xffffff, 0.25, 2000);
      fillLight2.position.set(-400, -200, -300);
      scene.add(fillLight2);

      // -------------------------
      // STAR GEOMETRY & MATERIAL
      // -------------------------
      const starGeometry = new THREE.BufferGeometry();
      const starCount = 10000;
      const starVertices = [];
      const starSpeeds = [];
      const spreadX = 2000,
        spreadY = 2000,
        spreadZ = 2000;
      const minSpeed = 0.05,
        maxSpeed = 0.08;
      const starSize = 1;
      for (let i = 0; i < starCount; i++) {
        const x = (Math.random() - 0.5) * spreadX;
        const y = (Math.random() - 0.5) * spreadY;
        const z = (Math.random() - 0.5) * spreadZ;
        starVertices.push(x, y, z);
        starSpeeds.push(Math.random() * (maxSpeed - minSpeed) + minSpeed);
      }
      starGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(starVertices, 3)
      );

      // ADD THIS LINE - Store original positions
      const initialStarPositions = new Float32Array(starVertices);
      const starTexture = new THREE.TextureLoader().load(
        "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/sprites/circle.png"
      );
      const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 2.5,
        map: starTexture,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      // ORIGINAL: points in main scene (commented out to avoid duplication)
      // const stars = new THREE.Points(starGeometry, starMaterial);
      // scene.add(stars);

      // -------------------------
      // DEDICATED STARS SCENE + RENDERER
      // -------------------------
      const starsScene = new THREE.Scene();
      const starsCamera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      starsCamera.position.z = 400;

      const starsRenderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      starsRenderer.setSize(window.innerWidth, window.innerHeight);
      starsRenderer.setClearColor(0x000000, 0); // transparent background
      starsRenderer.domElement.style.position = "fixed";
      starsRenderer.domElement.style.top = "0";
      starsRenderer.domElement.style.left = "0";
      // Make stars appear above most elements. Loader will hide first; then we fade stars in.
      starsRenderer.domElement.style.zIndex = "8001";
      starsRenderer.domElement.style.pointerEvents = "none";
      starsRenderer.domElement.style.opacity = "0"; // hidden until loader finishes
      starsRenderer.domElement.classList.add("three-canvas");
      document.body.appendChild(starsRenderer.domElement);

      // Reuse same geometry & material so positions update once
      const starsBg = new THREE.Points(starGeometry, starMaterial);
      starsScene.add(starsBg);

      // function animateStars(factor = 1) {
      //   // update positions (single source of truth: starGeometry)
      //   const positions = starGeometry.attributes.position.array;
      //   for (let i = 0; i < positions.length; i += 3) {
      //     positions[i + 1] += starSpeeds[i / 3] * factor;
      //     if (positions[i + 1] > spreadY / 2) {
      //       positions[i + 1] = -spreadY / 2;
      //       positions[i] = (Math.random() - 0.5) * spreadX;
      //       positions[i + 2] = (Math.random() - 0.5) * spreadZ;
      //     }
      //   }
      //   starGeometry.attributes.position.needsUpdate = true;
      //   // both scenes use same geometry, so no need to update separately
      // }

      const gltfLoader = new THREE.GLTFLoader();
      const solarSystem = new THREE.Group();
      solarSystem.scale.set(0.01, 0.01, 0.01);
      scene.add(solarSystem);
      const planets = [
        {
          name: "Sun",
          radius: 46,
          distance: 0,
          speed: 0,
          rotation: 0.001,
          file: "the_star_sun.glb",
          info: "The Sun, star at center.",
        },
        {
          name: "Mercury",
          radius: 6,
          distance: 40,
          speed: 0.008,
          rotation: 0.004,
          file: "mercury.glb",
          info: "Closest planet to Sun.",
        },
        {
          name: "Venus",
          radius: 9,
          distance: 60,
          speed: 0.006,
          rotation: 0.002,
          file: "venus.glb",
          info: "Very hot planet.",
        },
        {
          name: "Earth",
          radius: 11,
          distance: 80,
          speed: 0.004,
          rotation: 0.01,
          file: "earth.glb",
          info: "Our home planet.",
        },
        {
          name: "Mars",
          radius: 13,
          distance: 100,
          speed: 0.003,
          rotation: 0.008,
          file: "mars.glb",
          info: "Red planet.",
        },
        {
          name: "Jupiter",
          radius: 17,
          distance: 130,
          speed: 0.0015,
          rotation: 0.005,
          file: "jupiter.glb",
          info: "Largest planet.",
        },
        {
          name: "Saturn",
          radius: 16,
          distance: 155,
          speed: 0.0012,
          rotation: 0.008,
          file: "saturn.glb",
          info: "Has rings.",
        },
        {
          name: "Uranus",
          radius: 13,
          distance: 180,
          speed: 0.0009,
          rotation: 0.003,
          file: "uranus.glb",
          info: "Rotates on side.",
        },
        {
          name: "Neptune",
          radius: 10,
          distance: 200,
          speed: 0.0009,
          rotation: 0.003,
          file: "neptune.glb",
          info: "Far gas giant.",
        },
      ];
      const planetMeshes = [];
      const orbitMeshes = [];

      function loadPlanetModel(planet) {
        gltfLoader.load(`textures/models/${planet.file}`, (gltf) => {
          const mesh = gltf.scene;
          const bbox = new THREE.Box3().setFromObject(mesh);
          const center = new THREE.Vector3();
          bbox.getCenter(center);
          mesh.position.sub(center);
          const size = new THREE.Vector3();
          bbox.getSize(size);
          let scaleFactor = planet.radius / Math.max(size.x, size.y, size.z);
          if (planet.name === "Sun") scaleFactor *= 0.8;
          mesh.scale.setScalar(scaleFactor);
          const pivot = new THREE.Object3D();
          pivot.rotation.y = Math.random() * Math.PI * 2;
          pivot.userData.speed = planet.speed;
          pivot.userData.isPlanet = true;
          mesh.position.set(planet.distance, 0, 0);
          pivot.add(mesh);
          solarSystem.add(pivot);

          const div = document.createElement("div");
          div.className = "planet-label";
          div.textContent = `${planet.name}: ${planet.info}`;
          const label = new THREE.CSS2DObject(div);
          label.position.set(0, planet.radius + 15, 0);
          label.visible = false;
          mesh.add(label);
          mesh.userData.label = label;
          mesh.userData.isPlanet = true;

          if (planet.distance > 0) {
            const ringWidth = Math.max(0.06, planet.radius * 0.02 + 0.02);
            const orbit = new THREE.RingGeometry(
              planet.distance - ringWidth,
              planet.distance + ringWidth,
              256
            );
            const orbitMat = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.25,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
            });
            const orbitMesh = new THREE.Mesh(orbit, orbitMat);
            orbitMesh.rotation.x = Math.PI / 2;
            solarSystem.add(orbitMesh);
            orbitMeshes.push(orbitMesh);
          }
          planetMeshes.push({ mesh, pivot, planet });
          loadedAssets++;
          updateProgress();
        });
      }
      planets.forEach(loadPlanetModel);

      function updateMeshMap() {
        planetMeshes.forEach((p) => {
          if (p.planet.distance > 0) p.pivot.rotation.y += p.planet.speed || 0;
          p.mesh.rotation.y += p.planet.rotation || 0;
        });
        orbitMeshes.forEach((mesh) => (mesh.rotation.z += 0.0002));
      }

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let lastHoveredPlanet = null;
      window.addEventListener("mousemove", (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(
          planetMeshes.map((p) => p.mesh),
          true
        );
        if (lastHoveredPlanet && lastHoveredPlanet.userData.label) {
          lastHoveredPlanet.userData.label.visible = false;
        }

        lastHoveredPlanet = null;
        if (intersects.length > 0) {
          let planetObj = intersects[0].object;
          while (planetObj && !planetObj.userData.isPlanet) {
            planetObj = planetObj.parent;
          }

          if (planetObj && planetObj.userData.label) {
            planetObj.userData.label.visible = true;
            lastHoveredPlanet = planetObj;
          }
        }
      });

      let targetProgress = 0;
      let currentProgress = 0;
      let smoothTime = 0.08; // Base
      let lastTarget = 0; // NEW: Track direction
      let videoDuration = 0;
      let lastVideoTime = 0;
      // === PRO: requestVideoFrameCallback for MOBILE SMOOTHNESS ===
      let videoScrubbing = false;

      function scrubVideo() {
        if (
          !videoDuration ||
          astronautVideo.readyState < 2 ||
          videoOpacity <= 0.1
        ) {
          videoScrubbing = false;
          return;
        }

        const targetTime = videoDuration * videoProgress;
        const diff = targetTime - astronautVideo.currentTime;
        astronautVideo.currentTime += diff * 0.3;

        if (Math.abs(diff) > 0.05) {
          if (astronautVideo.paused) {
            astronautVideo.play().catch(() => {});
          }
        } else {
          if (!astronautVideo.paused) {
            astronautVideo.pause();
          }
        }

        if (videoScrubbing) {
          astronautVideo.requestVideoFrameCallback(scrubVideo);
        }
      }
      astronautVideo.addEventListener("loadedmetadata", () => {
        videoDuration = astronautVideo.duration || 0;
      });
      astronautVideo.pause();

      function initScrollControl() {
        let scrollTimeout;
        window.addEventListener("scroll", () => {
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(
            () => {
              const scrollY = window.scrollY;
              const scrollHeight =
                scrollContainer.offsetHeight - window.innerHeight;
              const mobileFactor = window.innerWidth < 768 ? 0.3 : 1;
              targetProgress =
                Math.min(scrollY / scrollHeight, 1) * mobileFactor;
            },
            window.innerWidth < 768 ? 16 : 8
          );
        });

        astronautVideo.addEventListener("ended", () => {
          gsap.to(astronautVideo, {
            opacity: 0,
            duration: 0.3,
            onComplete: () => {
              astronautVideo.style.visibility = "hidden";
              videoSection.style.display = "none";
            },
          });
        });

        requestAnimationFrame(mainLoop);
      }

      function mainLoop() {
        currentProgress += (targetProgress - currentProgress) * smoothTime;

        const direction = targetProgress > lastTarget ? 1 : -1;
        smoothTime = 0.08;
        lastTarget = targetProgress;
        const phaseSplit = 0.5;
        const videoProgress = Math.min(
          Math.max(currentProgress / phaseSplit, 0),
          1
        );
        const videoOpacity = 1 - Math.min(1, videoProgress * 1.2);

        // Video scrubbing (unchanged)
        // === SMOOTH VIDEO SCRUBBING (MOBILE FRIENDLY) ===
        if (
          videoDuration &&
          astronautVideo.readyState >= 2 &&
          videoOpacity > 0.1
        ) {
          const targetTime = videoDuration * videoProgress;
          const diff = targetTime - astronautVideo.currentTime;
          astronautVideo.currentTime += diff * 0.3;

          if (Math.abs(diff) > 0.05) {
            if (astronautVideo.paused) {
              astronautVideo.play().catch(() => {});
            }
          } else {
            if (!astronautVideo.paused) {
              astronautVideo.pause();
            }
          }
        }

        // Text fade & scale
        const fadeStart = 0.05,
          fadeEnd = 0.25;
        let fadeProgress = (videoProgress - fadeStart) / (fadeEnd - fadeStart);
        fadeProgress = Math.min(Math.max(fadeProgress, 0), 1);
        const weAreSpan = document.getElementById("weAreSpan");
        if (weAreSpan) {
          weAreSpan.style.opacity = 1 - fadeProgress;
          weAreSpan.style.width = `${
            (1 - fadeProgress) * weAreSpan.scrollWidth
          }px`;
        }

        const heyFynixProgress = Math.max((videoProgress - 0.25) / 0.75, 0);
        const scale = 1 - heyFynixProgress * 0.5;
        const textOpacity = 1 - heyFynixProgress * 1;
        const initialFontSize = 10;
        const minFontSize = 1;
        const fontSize =
          initialFontSize - heyFynixProgress * (initialFontSize - minFontSize);

        // FIX: सिर्फ एक बार transform, opacity, fontSize
        if (!topText.classList.contains("hovered")) {
          topText.style.transform = `translateX(-50%) scale(${scale})`;
        }
        topText.style.opacity = textOpacity;
        topText.style.fontSize = `${fontSize}vw`;

        // Video visibility
        astronautVideo.style.opacity = videoOpacity;
        if (videoOpacity > 0) {
          astronautVideo.style.visibility = "visible";
          videoSection.style.display = "flex";
          videoSection.style.visibility = "visible";
        } else {
          astronautVideo.style.visibility = "hidden";
          videoSection.style.display = "none";
          videoSection.style.visibility = "hidden";
        }

        // बाकी सब (solar, three.js, stars) → unchanged
        const sceneProgress = Math.min(
          Math.max((currentProgress - phaseSplit) / (1 - phaseSplit), 0),
          1
        );
        // === STARS FADE IN AFTER 10% SCROLL ===
        const starsFadeStart = 0.1; // 10% scroll
        const starsFadeEnd = 0.3; // 30% तक full
        const starsFadeProgress = Math.min(
          Math.max(
            (currentProgress - starsFadeStart) /
              (starsFadeEnd - starsFadeStart),
            0
          ),
          1
        );
        starsRenderer.domElement.style.opacity = starsFadeProgress;
        const sceneOpacity = sceneProgress > 0 ? 1 : 0;
        renderer.domElement.style.opacity = sceneOpacity;
        labelRenderer.domElement.style.opacity = sceneProgress > 0 ? 1 : 0;

        const allSpans = solarText.querySelectorAll("span");
        const letterProgress = sceneProgress * allSpans.length * 1.5;
        allSpans.forEach((span, index) => {
          const letterFadeProgress = Math.min(
            Math.max((letterProgress - index) / 1.5, 0),
            1
          );
          span.style.opacity = letterFadeProgress;
          span.style.transform = `translateY(${
            (1 - letterFadeProgress) * 30
          }px)`;
        });

        const solarScale = 1 - sceneProgress * 0.3;
        const initialSolarFontSize = 6;
        const minSolarFontSize = 1;
        const solarFontSize =
          initialSolarFontSize -
          sceneProgress * (initialSolarFontSize - minSolarFontSize);
        solarText.style.transform = `translateX(-50%) scale(${solarScale})`;
        solarText.style.fontSize = `${solarFontSize}vw`;
        solarText.style.visibility = sceneProgress > 0 ? "visible" : "hidden";

        if (sceneProgress > 0.85) {
          gsap.to(solarText, { opacity: 0, duration: 1, ease: "power2.out" });
        } else {
          gsap.to(solarText, { opacity: 1, duration: 1, ease: "power2.out" });
        }

        if (sceneOpacity > 0) {
          renderer.domElement.style.visibility = "visible";
          labelRenderer.domElement.style.visibility = "visible";
          renderer.domElement.style.pointerEvents = "auto";
        } else {
          renderer.domElement.style.visibility = "hidden";
          labelRenderer.domElement.style.visibility = "hidden";
          renderer.domElement.style.pointerEvents = "none";
        }

        if (sceneOpacity > 0) {
          const scaleFactor = window.innerWidth < 768 ? 0.7 : 1;
          const baseScale = 0.15 + (0.8 - 0.15) * sceneProgress;
          solarSystem.scale.setScalar(baseScale * scaleFactor);
          solarSystem.position.y =
            -window.innerHeight * 2.5 +
            window.innerHeight * 2.5 * sceneProgress;
          camera.position.z = (350 - 150 * sceneProgress) * scaleFactor;
          camera.lookAt(0, 0, 0);
          controls.enableRotate = sceneProgress > 0.15;
        } else {
          controls.enableRotate = false;
        }

        updateMeshMap();

        if (starsScene && starsRenderer && starsCamera) {
          // === STARS MOVE WITH SCROLL (PARALLAX BACKGROUND) ===
          const scrollOffset = currentProgress - 0.5; // -0.5 to +0.5
          // SLOWER & SMOOTHER parallax
          const starShiftX = scrollOffset * 250; // 800 → 250
          const starShiftY = scrollOffset * 180; // 600 → 180
          const starShiftZ = scrollOffset * 300; // 1000 → 300

          const positions = starGeometry.attributes.position.array;
          for (let i = 0; i < positions.length; i += 3) {
            positions[i + 0] = initialStarPositions[i + 0] + starShiftX;
            positions[i + 1] = initialStarPositions[i + 1] + starShiftY;
            positions[i + 2] = initialStarPositions[i + 2] + starShiftZ;
          }
          starGeometry.attributes.position.needsUpdate = true;

          starsRenderer.render(starsScene, starsCamera);
        }

        controls.update();

        // === SYNC STARS CAMERA WITH MAIN CAMERA ===
        starsCamera.rotation.copy(camera.rotation);
        starsCamera.position.copy(camera.position);
        starsCamera.position.z = 400; // keep stars in background

        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        starsRenderer.render(starsScene, starsCamera); // ← already hai, but confirm

        requestAnimationFrame(mainLoop);
      }
      // DYNAMIC SCROLL HEIGHT
      function updateScrollHeight() {
        const factor = window.innerWidth < 768 ? 12 : 8;
        scrollContainer.style.height = `${window.innerHeight * factor}px`;
      }
      updateScrollHeight();
      window.addEventListener("resize", updateScrollHeight);
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);

        // update stars renderer & camera
        starsCamera.aspect = window.innerWidth / window.innerHeight;
        starsCamera.updateProjectionMatrix();
        starsRenderer.setSize(window.innerWidth, window.innerHeight);
      });

      window.addEventListener("keydown", (e) => {
        const scrollHeight = scrollContainer.offsetHeight - window.innerHeight;
        const step = scrollHeight * 0.05;
        let scrollY = window.scrollY;
        if (e.key === "ArrowDown") {
          scrollY = Math.min(scrollY + step, scrollHeight);
          window.scrollTo(0, scrollY);
        }
        if (e.key === "ArrowUp") {
          scrollY = Math.max(scrollY - step, 0);
          window.scrollTo(0, scrollY);
        }
      });
    </script>
  </body>
</html>
